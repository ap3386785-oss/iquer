<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Alcohol Verification - {{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Background glowing aesthetics -->
    <div class="hud-grid-bg"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <!-- Navigation Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
            </div>
            <span class="brand-text">Aegis Spirit</span>
        </div>
        
        <ul class="sidebar-menu">
            <li class="menu-item {% if request.path == '/' or request.path == '/terminal' %}active{% endif %}">
                <a href="{{ url_for('terminal_page') }}">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 4H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM3 6h18v4H3V6zm18 12H3V12h18v6z"/>
                    </svg>
                    <span>POS Terminal</span>
                </a>
            </li>
            <li class="menu-item {% if request.path == '/register' %}active{% endif %}">
                <a href="{{ url_for('register_page') }}">
                    <svg viewBox="0 0 24 24">
                        <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <span>Register Customer</span>
                </a>
            </li>
            <li class="menu-item {% if request.path == '/dashboard' %}active{% endif %}">
                <a href="{{ url_for('dashboard_page') }}">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14H7v-7h3v7zm4 0h-3V5h3v12zm4 0h-3v-4h3v4z"/>
                    </svg>
                    <span>Owner Dashboard</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <p>Aegis Smart Alcohol System</p>
            <p>v2.1.0-AI Secure</p>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <main class="main-wrapper">
        <header>
            <div class="header-title">
                <h1>{{ title }}</h1>
                <p id="header-subtitle">AI-Based Purchase Verification & Limits</p>
            </div>
            
            <div class="shop-selector">
                <label for="active-shop-select">Active Shop Counter</label>
                <select id="active-shop-select">
                    {% for shop in shops %}
                        <option value="{{ shop.id }}">{{ shop.name }} ({{ shop.location }})</option>
                    {% endfor %}
                </select>
            </div>
        </header>

        {% block content %}
        {% endblock %}
    </main>

    <!-- Core Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
